name: Verify Public Domain Cinema

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "extensions/en/publicdomaincinema/**"
      - "gradle.properties"
      - ".github/workflows/verify-publicdomaincinema.yml"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      CI_EXTENSIONS: "en.publicdomaincinema"
      KEY_STORE_PASSWORD: "temporary-build-only"
      ALIAS: "temporary"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create temporary signing config for Gradle evaluation
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/temporary.jks" \
            -storepass "$KEY_STORE_PASSWORD" \
            -keypass "$KEY_STORE_PASSWORD" \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=Temporary Build, OU=CI, O=Local, L=NA, ST=NA, C=US"
          echo "KEY_FILE=$RUNNER_TEMP/temporary.jks" >> "$GITHUB_ENV"

      - name: Compile source and validate generated source ID
        run: |
          chmod +x ./gradlew
          ./gradlew checkSourceIdFormula :extensions:en:publicdomaincinema:assembleDebug --console=plain

      - name: Upload compile-check APK
        uses: actions/upload-artifact@v4
        with:
          name: public-domain-cinema-compile-check
          path: extensions/en/publicdomaincinema/build/outputs/apk/debug/*.apk
          if-no-files-found: error
